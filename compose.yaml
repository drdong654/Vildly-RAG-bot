services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uv run --no-sync uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KB_DATABASE_URL: ${KB_DATABASE_URL}
      OLLAMA_HOST: ${OLLAMA_HOST}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

    depends_on:
      - db
      - ollama
    ports:
      - "8000:8000"

  bot:
    build: .
    restart: always
    command: uv run --no-sync python -m bot.main
    environment:
      TOKEN: ${TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      KB_DATABASE_URL: ${KB_DATABASE_URL}
      OLLAMA_HOST: ${OLLAMA_HOST}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      - db
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: